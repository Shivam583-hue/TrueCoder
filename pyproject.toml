[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "truecoder"
version = "1.0.1"
description = "A terminal coding agent with an auditable execution plane"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["ai", "agent", "coding", "terminal", "developer-tools"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27,<1",
    "openai>=2.46",
    "python-dotenv>=1.2",
    "textual>=8.2,<9",
    "tiktoken>=0.13,<1",
    "pydantic>=2,<3",
    "platformdirs>=4,<5",
    "typing-extensions>=4.1,<5",
]

[project.scripts]
truecoder = "truecoder.cli:run"

[project.urls]
Homepage = "https://github.com/Shivam583-hue/TrueCoder"
Documentation = "https://github.com/Shivam583-hue/TrueCoder#readme"
Changelog = "https://github.com/Shivam583-hue/TrueCoder/blob/main/CHANGELOG.md"
Issues = "https://github.com/Shivam583-hue/TrueCoder/issues"
Source = "https://github.com/Shivam583-hue/TrueCoder"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
truecoder = ["tui/*.tcss"]
